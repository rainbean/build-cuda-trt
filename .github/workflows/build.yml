name: Build Packages

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            command: pack-linux.sh
          - os: ubuntu-22.04-arm
            command: pack-linux.sh
          - os: windows-2022
            command: pack-windows.ps1

    steps:
      - uses: actions/checkout@v6

      - name: Install winget
        if: contains(matrix.os, 'windows')
        uses: Cyberboss/install-winget@v1

      - name: Pack slim and tools packages
        working-directory: ${{ github.workspace }}
        run: ${{ github.workspace }}/scripts/${{ matrix.command }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ap-northeast-1

      - name: Upload to S3
        if: contains(matrix.os, 'ubuntu')
        run: |
          for f in cuda-trt-*.tar.zst; do
            aws s3 cp "$f" "s3://${{ secrets.AWS_S3_BUCKET }}/cuda-trt/$f"
          done

      - name: Upload to S3
        if: contains(matrix.os, 'windows')
        run: |
          Get-ChildItem "cuda-trt-*.7z" | ForEach-Object {
            aws s3 cp $_.FullName "s3://${{ secrets.AWS_S3_BUCKET }}/cuda-trt/$($_.Name)"
          }
